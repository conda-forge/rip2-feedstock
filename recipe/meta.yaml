{% set name = "rip2" %}
{% set version = "0.9.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/MilesCranmer/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 8f3dbd77775e4b632e99eff6cd3b0ac4e9f886d7e879d8648484cf3e7d0e0cee

build:
  number: 0

requirements:
  build:
    - {{ compiler("rust") }}
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
  commands:
    - rip --version

about:
  home: https://github.com/MilesCranmer/rip2
  dev_url: https://github.com/MilesCranmer/rip2
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: A safe and ergonomic alternative to rm

extra:
  recipe-maintainers:
    - apcamargo
